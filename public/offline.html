<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline | AK Solar</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #1c2b33;
    color: #f4f6f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }
  .icon {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    background: #f5b400;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }
  .icon svg { width: 36px; height: 36px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; color: #b7c2c7; margin: 0 0 24px; max-width: 320px; line-height: 1.5; }
  button {
    background: #f5b400;
    color: #1c2b33;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M35 24 23 40h8l-2 11 12-17h-8z" fill="#1c2b33"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>AK Solar needs an internet connection to load stock, customer and invoice data. Reconnect and try again.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
